defaults:
  - _self_
  - override hydra/launcher:  local
  - override hydra/output:  local

# snapshot
save_snapshot: false
load_snap: ""

# replay buffer
num_workers: 0
batch_size: 32 
train_steps: 489200  # 100 epochs (dataset has 156560 samples, batch_size=32 → 4892 steps/epoch)
eval_freq: 1000

# misc
seed: 1
device: cuda

# experiment
experiment: train_model
model: derail
wandbuser: 
wandbproject: 

# data
dataset: D4RL/kitchen/partial-v2
datapath: 
doaug: "none"

agent:
  _target_: vip.models.model_derail.StateEuclideanDERAIL
  device: ${device}
  lr: 1e-4
  hidden_dim: 256
  size: 1
  mlp_width: 256
  l2weight: 0.0
  l1weight: 0.0
  conservative_weight: 0.9
  gamma: 0.98
  num_negatives: 0