defaults:
  - _self_
  - override hydra/launcher:  local
  - override hydra/output:  local

# snapshot
save_snapshot: false
load_snap: ""

# replay buffer
num_workers: 0
batch_size: 32 
train_steps: 50001
eval_freq: 10000

# misc
seed: 1
device: cuda

# experiment
experiment: train_model
model: iql
wandbuser: 
wandbproject: 

# data
dataset: D4RL/kitchen/complete-v2
datapath: 
doaug: "none"
use_achieved_goal: false

agent:
  _target_: vip.models.model_iql.StateIQL
  device: ${device}
  lr: 1e-4
  hidden_dim: 32
  size: 0
  mlp_width: 64
  expectile: 0.7
  beta: 3.0
  max_adv: 100.0
