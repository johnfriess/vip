defaults:
  - _self_
  - override hydra/launcher:  local
  - override hydra/output:  local

# snapshot
save_snapshot: false
load_snap: ""

# replay buffer
num_workers: 4
batch_size: 32
train_steps: 50001
eval_freq: 10000

# misc
seed: 1
device: cuda

# experiment
experiment: train_model
model: derail
wandbuser:
wandbproject:

# data
# Set datapath to one of:
#   /data/siddhant/vip/vis_data/kitchen-mixed-v0
#   /data/siddhant/vip/vis_data/kitchen-complete-v0
dataset: kitchen-image
datapath: /data/siddhant/vip/vis_data/kitchen-mixed-v0
doaug: "none"
use_achieved_goal: false
frame_stack: 1

agent:
  _target_: vip.models.model_derail.ImageEuclideanDERAIL
  device: ${device}
  lr: 1e-5
  hidden_dim: 256
  size: 18
  conservative_weight: 0.45
  gamma: 0.9
  num_negatives: 0
